<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220" width="100%" height="100%">
  <defs>
    <!-- Gradient for left vertical stem -->
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#029E9A"/>
      <stop offset="55%" stop-color="#00808C"/>
      <stop offset="100%" stop-color="#032D56"/>
    </linearGradient>

    <!-- Gradient for upper diagonal bar -->
    <linearGradient id="diagUpperGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#05284F"/>
      <stop offset="100%" stop-color="#0A2240"/>
    </linearGradient>

    <!-- Gradient for growth chart bars -->
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#016A7E"/>
      <stop offset="100%" stop-color="#00AFA5"/>
    </linearGradient>

    <!-- Gradient for swoop arrow -->
    <linearGradient id="arrowSwoopGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#02305C"/>
      <stop offset="40%" stop-color="#00798C"/>
      <stop offset="80%" stop-color="#00B4A0"/>
      <stop offset="100%" stop-color="#00BF9A"/>
    </linearGradient>
  </defs>

  <!-- ==================== LEFT LOGO MARK (STYLIZED K) ==================== -->
  <g id="logo-symbol">
    <!-- Left Main Pillar -->
    <path d="M 52 46
             C 52 38 58 32 66 32
             L 94 32
             C 96 32 98 34 98 36
             L 98 68
             C 74 92 68 114 68 140
             C 68 152 70 162 74 170
             L 66 170
             C 58 170 52 164 52 156
             Z"
          fill="url(#stemGrad)" />

    <!-- Upper diagonal segment of K -->
    <polygon points="108,82 170,32 196,32 108,102" fill="url(#diagUpperGrad)" />

    <!-- Rising Growth Bars -->
    <rect x="115" y="126" width="16" height="34" rx="2" fill="#04325C" />
    <rect x="139" y="106" width="17" height="54" rx="2.5" fill="url(#barGrad)" />
    <rect x="164" y="80" width="18" height="80" rx="3" fill="url(#barGrad)" />

    <!-- Upward Swoop Curve -->
    <path d="M 52 168
             C 75 188 112 192 148 180
             C 178 170 205 146 226 112
             C 216 138 190 166 156 174
             C 120 182 85 178 62 160
             Z"
          fill="url(#arrowSwoopGrad)" />

    <!-- Arrowhead -->
    <polygon points="228,84 246,128 226,120 208,136" fill="#00B59F" />
  </g>

  <!-- ==================== VERTICAL SEPARATOR ==================== -->
  <line x1="285" y1="28" x2="285" y2="192" stroke="#B0BEC5" stroke-width="1.6" stroke-linecap="round" />

  <!-- ==================== BRAND TYPOGRAPHY ==================== -->
  <!-- 1. "KARVION" -->
  <g id="brand-name" fill="#05142B" font-family="'Plus Jakarta Sans', 'Segoe UI', 'Montserrat', -apple-system, sans-serif" font-weight="900" font-size="64" letter-spacing="4.5">
    <text x="330" y="88">K</text>
    <text x="390" y="88">A</text>
    <polygon points="408,72 423,54 438,72" fill="#00A693" />
    <text x="450" y="88">RVION</text>
  </g>

  <!-- 2. "CAPITAL" with flanking accent lines -->
  <g id="brand-sub">
    <line x1="334" y1="126" x2="384" y2="126" stroke="#00A693" stroke-width="3.5" stroke-linecap="round" />
    <text x="406" y="136" 
          fill="#00A693" 
          font-family="'Plus Jakarta Sans', 'Segoe UI', 'Montserrat', -apple-system, sans-serif" 
          font-weight="800" 
          font-size="28" 
          letter-spacing="14.5">CAPITAL</text>
    <line x1="772" y1="126" x2="822" y2="126" stroke="#00A693" stroke-width="3.5" stroke-linecap="round" />
  </g>

  <!-- 3. Primary Tagline -->
  <text x="584" y="166" 
        text-anchor="middle"
        fill="#1A2838" 
        font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
        font-weight="700" 
        font-size="13" 
        letter-spacing="3.8">SMART FINANCE. BETTER FUTURE.</text>

  <!-- 4. Secondary Services Subline -->
  <g fill="#4B5B6D" 
     font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
     font-weight="600" 
     font-size="11.5" 
     letter-spacing="2"
     text-anchor="middle">
    <text x="584" y="188">
      LOANS <tspan fill="#00A693" font-weight="400"> | </tspan> CREDIT CARDS <tspan fill="#00A693" font-weight="400"> | </tspan> BUSINESS FINANCE <tspan fill="#00A693" font-weight="400"> | </tspan> MORE
    </text>
  </g>
</svg>

